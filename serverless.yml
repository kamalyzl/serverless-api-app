service: serverless-api-app
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    DYNAMODB_TABLE: ${env:DYNAMODB_TABLE}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/PlanetWeatherTable

plugins:
  - serverless-offline

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude: ['aws-sdk']
    target: 'node20'
    platform: 'node'

functions:
  merged:
    handler: src/presentation/lambdas/mergedHandler.main
    timeout: 15
    events:
      - http:
          path: fusionados
          method: get
          cors: true
  store:
    handler: src/presentation/lambdas/storeAggregatedHandler.main
    timeout: 15
    events:
      - http:
          path: almacenar
          method: post
          cors: true
  history:
    handler: src/presentation/lambdas/getHistoryHandler.main
    timeout: 15
    events:
      - http:
          path: historial
          method: get
          cors: true

package:
  individually: true

resources:
  Resources:
    PlanetWeatherTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: PlanetWeatherTable
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        
