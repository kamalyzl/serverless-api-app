service: serverless-api-app
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'local'}
  logs:
    restApi: true         # Habilita logs de API Gateway
    httpApi: true         # Si estás usando HTTP API
  environment:
    NODE_ENV: ${env:NODE_ENV}
    DYNAMODB_TABLE: ${env:DYNAMODB_TABLE, ''}
    REDIS_URL: ${env:REDIS_URL, ''}
    SWAPI_BASE_URL: ${env:SWAPI_BASE_URL, ''}
    WEATHER_BASE_URL: ${env:WEATHER_BASE_URL, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/PlanetWeatherTable
        - Effect: Allow
          Action:
            - elasticache:*
          Resource: "*"

plugins:
  - serverless-offline
  - serverless-openapi-documentation

custom:
  documentation:
    version: '1.0.0'
    title: 'API de Clima Planetario'
    description: 'API para consultar y almacenar información del clima de planetas usando Serverless y AWS.'
    models:
      - name: PlanetWeatherHistoryResponse
        contentType: "application/json"
        schema:
          type: object
          properties:
            planet:
              type: string
            weatherHistory:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  temperature:
                    type: number
                  description:
                    type: string
      - name: StoreAggregatedResponse
        contentType: "application/json"
        schema:
          type: object
          properties:
            message:
              type: string
      - name: MergedResponse
        contentType: "application/json"
        schema:
          type: object
          properties:
            mergedData:
              type: array
              items:
                type: object
                properties:
                  planet:
                    type: string
                  temperature:
                    type: number
                  description:
                    type: string

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude: ['aws-sdk']
    target: 'node20'
    platform: 'node'

functions:
  merged:
    handler: src/presentation/lambdas/mergedHandler.main
    memorySize: 256         # Ajustado para uso eficiente (puede ser 128 si las funciones son livianas)
    timeout: 5              # Tiempo de espera en segundos (ajustado a lo necesario)
    name: get-fusionados-fn
    events:
      - http:
          path: fusionados
          method: get
          cors: true
          documentation:
            summary: "Obtener datos fusionados de clima planetario"
            description: "Devuelve datos fusionados de clima de varios planetas."
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: "Respuesta con datos fusionados."
                responseModels:
                  "application/json": "MergedResponse"
  store:
    handler: src/presentation/lambdas/storeAggregatedHandler.main
    memorySize: 256
    timeout: 5
    name: store-aggregated-fn
    events:
      - http:
          path: almacenar
          method: post
          cors: true
          documentation:
            summary: "Almacenar datos agregados de clima"
            description: "Almacena datos agregados de clima de un planeta."
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: "Confirmación de almacenamiento."
                responseModels:
                  "application/json": "StoreAggregatedResponse"
  history:
    handler: src/presentation/lambdas/getHistoryHandler.main
    memorySize: 256
    timeout: 5
    name: get-history-fn
    events:
      - http:
          path: historial
          method: get
          cors: true
          documentation:
            summary: "Obtener historial de clima de un planeta"
            description: "Devuelve el historial de clima para un planeta específico."
            queryParams:
              - name: limit
                description: "Cantidad máxima de registros a devolver."
                required: false
                type: integer
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: "Historial de clima del planeta."
                responseModels:
                  "application/json": "PlanetWeatherHistoryResponse"

package:
  individually: true

resources:
  Resources:
    PlanetWeatherTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: PlanetWeatherTable
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        
